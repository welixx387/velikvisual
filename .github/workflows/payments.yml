name: Payments

on:
  schedule:
    - cron: '2-59/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: payments
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Check ЮMoney payments
        id: pay
        env:
          YOOMONEY_TOKEN: ${{ secrets.YOOMONEY_TOKEN }}
        run: python3 tools/payments.py

      - name: Publish purchases
        if: steps.pay.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SUMMARY: ${{ steps.pay.outputs.summary }}
        run: |
          git config user.name "VelikVisual Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/
          git commit -m "Payments: $SUMMARY"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
          gh api -X POST "repos/$GITHUB_REPOSITORY/pages/builds" --silent || true
