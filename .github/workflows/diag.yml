name: Diag

on:
  workflow_dispatch:

jobs:
  reach:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Reach ЮMoney API
        run: |
          for i in 1 2 3; do
            curl -s -o /dev/null -m 30 -w "curl api %{http_code} %{time_total}s\n" -X POST https://yoomoney.ru/api/operation-history -H "Authorization: Bearer x" -d "records=1" || echo "curl failed $?"
          done
          python3 - <<'EOF'
          import time, urllib.request, urllib.error
          for i in range(3):
              t = time.time()
              try:
                  urllib.request.urlopen(urllib.request.Request('https://yoomoney.ru/api/operation-history', data=b'records=1', headers={'Authorization': 'Bearer x'}), timeout=30)
              except urllib.error.HTTPError as e:
                  print('python api', e.code, round(time.time() - t, 2))
              except Exception as e:
                  print('python api ERR', type(e).__name__, round(time.time() - t, 2))
          EOF
