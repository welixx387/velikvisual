<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>404</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #050506; color: #8b8b95; font: 16px system-ui, sans-serif; text-align: center; }
  h1 { color: #f4f4f6; font-size: 64px; margin: 0 0 8px; }
  pre { max-width: min(90vw, 640px); white-space: pre-wrap; word-break: break-all; background: #111115; color: #f4f4f6; padding: 14px; border-radius: 12px; }
  button { margin-top: 10px; padding: 10px 18px; border: 0; border-radius: 999px; background: #fff; color: #000; font-weight: 600; cursor: pointer; }
  a { color: #f4f4f6; }
</style>
</head>
<body>
<main id="main"><h1>404</h1><p>Страница не найдена. <a href="/">На главную</a></p></main>
<script>
// Only the ЮMoney connection uses this page (redirect URI of the VelikVisual app in ЮMoney):
// admin.html#connect=<client_id> starts it, ЮMoney returns here with ?code=..., which goes to
// tools/connect_yoomoney.py --listen on the owner's computer. Purchases are granted in GitHub
// (Actions → «Выдать покупку»), not here.
(() => {
  const qs = new URLSearchParams(location.search);
  const cm = /^#connect=([0-9A-Fa-f]+)$/.exec(location.hash);
  if (cm) {
    try { sessionStorage.setItem('vvLocalConnect', '1'); } catch (e) { /* private mode */ }
    location.replace(`https://yoomoney.ru/oauth/authorize?${new URLSearchParams({ client_id: cm[1], response_type: 'code', redirect_uri: `${location.origin}/admin.html`, scope: 'account-info operation-history' })}`);
    return;
  }
  if (!qs.has('code') && !qs.has('error')) return;
  let toLocal = false;
  try { toLocal = sessionStorage.getItem('vvLocalConnect') === '1'; sessionStorage.removeItem('vvLocalConnect'); } catch (e) { /* private mode */ }
  if (toLocal) {
    location.replace(`http://127.0.0.1:8765/cb?${qs}`);
    return;
  }
  const main = document.getElementById('main');
  if (qs.has('error')) {
    main.innerHTML = '<p></p>';
    main.firstChild.textContent = `ЮMoney вернул ошибку: ${qs.get('error_description') || qs.get('error')}`;
    return;
  }
  main.innerHTML = '<p>Код подтверждения ЮMoney для программы подключения:</p><pre></pre><button>Скопировать код</button>';
  main.querySelector('pre').textContent = qs.get('code');
  main.querySelector('button').onclick = () => navigator.clipboard.writeText(qs.get('code'));
})();
</script>
</body>
</html>
